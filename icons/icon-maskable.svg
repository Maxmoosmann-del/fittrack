<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Maskable-Variante: Android schneidet bis zu 20 % rundum ab (Kreis, Squircle …).
       Die Hantel liegt deshalb verkleinert in der sicheren Mitte (Radius 40),
       der Warnstreifen entfällt. Quelle für icon-maskable.png. -->
  <defs>
    <pattern id="scan" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="0.7" fill="#000" opacity=".3"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="#ff2a55"/>
  <path fill="#040203" transform="translate(50 50) scale(.78) translate(-50 -48)" d="M14 34h10v28h-10zM26 26h10v44h-10zM36 43h28v10h-28zM64 26h10v44h-10zM76 34h10v28h-10z"/>
  <rect width="100" height="100" fill="url(#scan)"/>
</svg>
